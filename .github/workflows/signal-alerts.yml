name: Stock Signal Alerts

on:
  schedule:
    # 18:15 UTC = after US market close and well after European close.
    # Adjust if you want it earlier for European markets specifically.
    - cron: "15 18 * * 1-5"
  workflow_dispatch: {}  # allows manual "Run workflow" button in GitHub UI

permissions:
  contents: write  # needed to commit alerts/state.json back to the repo

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m alerts.alert_check

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alerts/state.json
          git diff --cached --quiet || git commit -m "Update signal state [skip ci]"
          git push
